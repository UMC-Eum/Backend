name: CI

on:
  push:
    branches: ['main', 'dev']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          fail-on-scopes: runtime

  quality:
    name: Quality, Unit Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Clean install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:cov -- --runInBand

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Production build
        run: npm run build

  integration:
    name: Database Migration & E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d eum_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      PORT: 3000
      LOG_LEVEL: info
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/eum_test
      REDIS_URL: redis://127.0.0.1:6379
      AWS_REGION: ap-northeast-2
      AWS_S3_BUCKET: eum-voice-test
      CHAT_MEDIA_BUCKET: eum-chat-test
      MEDIA_PUT_PRESIGN_EXPIRES_SEC: 300
      MEDIA_GET_PRESIGN_EXPIRES_SEC: 3600
      FASTAPI_BASE_URL: http://fastapi.eum.local:8000
      FASTAPI_TIMEOUT_MS: 10000
      FASTAPI_HEALTH_URL: http://fastapi.eum.local:8000/health
      KAKAO_CLIENT_ID: test-kakao-client-id
      KAKAO_CLIENT_SECRET: test-kakao-client-secret
      APPLE_TEAM_ID: TESTTEAM01
      APPLE_KEY_ID: TESTKEY001
      APPLE_CLIENT_ID: com.eum-dating.test
      APPLE_PRIVATE_KEY: test-private-key
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 14d

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Clean install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations to empty database
        run: npm run prisma:migrate:deploy

      - name: E2E tests
        run: npm run test:e2e -- --runInBand
