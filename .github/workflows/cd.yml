name: CD - Deploy to Staging (ECS)

on:
  push:
    branches: ["dev"]

concurrency:
  group: cd-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Staging ECS
    runs-on: ubuntu-latest
    # 인증: OIDC 대신 임시로 IAM 액세스 키 사용 (secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY).
    #       추후 GitHub OIDC role로 교체 권장.
    permissions:
      contents: read

    env:
      AWS_REGION: ap-northeast-2
      ECR_REGISTRY: 413790913159.dkr.ecr.ap-northeast-2.amazonaws.com
      ECR_REPOSITORY: eum-backend
      ECS_CLUSTER: eum-cluster
      ECS_SERVICE: eum-backend-service
      ECS_TASK_FAMILY: eum-backend
      CONTAINER_NAME: eum-backend
      HEALTH_URL: https://staging.eum-dating.com/api/v1/health

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (access key)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: |
          echo "image=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_FAMILY }} \
            --query taskDefinition > task-definition.json

      - name: Render new task definition with new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.tag.outputs.image }}

      - name: Run Prisma migrate (ECS one-off task)
        id: migrate
        env:
          RENDERED_TASK_DEF: ${{ steps.render.outputs.task-definition }}
        run: |
          set -euo pipefail

          TD_ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://$RENDERED_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "td_arn=$TD_ARN" >> "$GITHUB_OUTPUT"
          echo "Registered task def: $TD_ARN"

          # CPU=0: 클러스터에 예약 CPU 여유가 없어도 배치되도록 (migrate는 짧고 I/O 중심)
          # memoryReservation=256: 배치 판단용 최소 메모리만 잡고, 호스트 잔여로 흡수
          OVERRIDES=$(jq -nc \
            --arg name "${{ env.CONTAINER_NAME }}" \
            '{containerOverrides: [{name: $name, command: ["npx","prisma","migrate","deploy"], cpu: 0, memoryReservation: 256}]}')

          RUN_OUT=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --launch-type EC2 \
            --task-definition "$TD_ARN" \
            --overrides "$OVERRIDES" \
            --output json)

          TASK_ARN=$(echo "$RUN_OUT" | jq -r '.tasks[0].taskArn // empty')
          if [ -z "$TASK_ARN" ]; then
            echo "::error::run-task가 마이그레이션 태스크를 시작하지 못했습니다 (배치 실패)"
            echo "$RUN_OUT" | jq -r '.failures'
            exit 1
          fi
          echo "Migrate task: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster ${{ env.ECS_CLUSTER }} --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[?name==`${{ env.CONTAINER_NAME }}`].exitCode | [0]' \
            --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Prisma migrate failed (exit=$EXIT_CODE)"
            exit 1
          fi
          echo "Prisma migrate completed"

      - name: Deploy to ECS service
        # migrate 스텝에서 등록한 동일 TD 리비전을 재사용 (중복 register 방지)
        env:
          TD_ARN: ${{ steps.migrate.outputs.td_arn }}
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition "$TD_ARN" > /dev/null

          # `aws ecs wait services-stable`은 옛 deployment가 ACTIVE로 남아있는 동안 풀리지 않아
          # 새 태스크가 멀쩡히 떠도 자주 타임아웃까지 끌려간다. 더 실용적으로,
          # PRIMARY deployment의 rolloutState=COMPLETED만 확인한다 (= 새 태스크 healthy + desiredCount 도달).
          # 이미지 pull(1~3분) + ALB healthcheck warmup(1~2.5분) + 컨테이너 부팅까지 합하면 7~12분이
          # 일반적이라, 여유롭게 60회 × 15s = 15분으로 설정한다.
          MAX_ATTEMPTS=60
          INTERVAL=15
          echo "Polling PRIMARY deployment rolloutState (max $((MAX_ATTEMPTS * INTERVAL / 60))min, ${INTERVAL}s 간격)..."
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            INFO=$(aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER }} \
              --services ${{ env.ECS_SERVICE }} \
              --query "services[0].deployments[?status=='PRIMARY'] | [0]" \
              --output json)
            STATE=$(echo "$INFO" | jq -r '.rolloutState // "UNKNOWN"')
            RUNNING=$(echo "$INFO" | jq -r '.runningCount // 0')
            DESIRED=$(echo "$INFO" | jq -r '.desiredCount // 0')
            FAILED_TASKS=$(echo "$INFO" | jq -r '.failedTasks // 0')
            echo "[$i/$MAX_ATTEMPTS] PRIMARY rolloutState=$STATE running=$RUNNING/$DESIRED failedTasks=$FAILED_TASKS"
            case "$STATE" in
              COMPLETED)
                echo "Deployment completed."
                exit 0
                ;;
              FAILED)
                echo "::error::PRIMARY deployment FAILED"
                aws ecs describe-services \
                  --cluster ${{ env.ECS_CLUSTER }} \
                  --services ${{ env.ECS_SERVICE }} \
                  --query 'services[0].deployments' --output json
                exit 1
                ;;
            esac
            sleep "$INTERVAL"
          done

          echo "::error::Timeout: PRIMARY rolloutState가 $((MAX_ATTEMPTS * INTERVAL / 60))분 안에 COMPLETED 도달 못 함"
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].deployments' --output json
          exit 1

      - name: Smoke test (ALB health)
        run: |
          for i in {1..12}; do
            if curl -fsS --max-time 5 "$HEALTH_URL" > /dev/null; then
              echo "Health check passed"
              exit 0
            fi
            echo "attempt $i/12 failed, retrying in 5s"
            sleep 5
          done
          echo "::error::Health check failed after 60s"
          exit 1
