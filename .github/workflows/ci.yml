name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eum_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d eum_dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      PORT: 3000
      LOG_LEVEL: info
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/eum_dev
      REDIS_URL: redis://127.0.0.1:6379
      AWS_REGION: ap-northeast-2
      AWS_S3_BUCKET: eum-voice-test
      CHAT_MEDIA_BUCKET: eum-chat-test
      MEDIA_PUT_PRESIGN_EXPIRES_SEC: 300
      MEDIA_GET_PRESIGN_EXPIRES_SEC: 3600
      FASTAPI_BASE_URL: http://fastapi.eum.local:8000
      FASTAPI_TIMEOUT_MS: 10000
      FASTAPI_HEALTH_URL: http://fastapi.eum.local:8000/health
      KAKAO_CLIENT_ID: test-kakao-client-id
      KAKAO_CLIENT_SECRET: test-kakao-client-secret
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 14d

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: "npm"

      - name: Clean install dependencies
        run: |
          rm -rf node_modules .prisma
          npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Prisma migrate (deploy)
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
